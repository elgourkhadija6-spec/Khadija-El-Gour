<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>الصفحة غير موجودة | خديجة الكور</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;700&family=Amiri:wght@700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { min-height: 100vh; display: grid; place-items: center; background: #FAFAF7; color: #1C1C1C; font-family: 'Readex Pro', 'Segoe UI', sans-serif; text-align: center; padding: 2rem; }
    .code { font-family: 'Amiri', serif; font-size: clamp(4rem, 14vw, 7rem); color: #E8A000; line-height: 1; }
    h1 { font-family: 'Amiri', serif; font-size: clamp(1.6rem, 4vw, 2.2rem); margin: 1rem 0 0.5rem; }
    p { color: rgba(23,33,43,0.75); margin-bottom: 2rem; line-height: 1.9; }
    a { display: inline-block; padding: 0.85rem 2rem; background: #E8A000; color: #fff; font-weight: 700; border-radius: 4px; text-decoration: none; }
    a:hover { background: #d49200; }
  </style>
</head>
<body>
  <main>
    <div class="code">404</div>
    <h1>هذه الصفحة غير موجودة</h1>
    <p>ربما تغيّر الرابط أو حُذفت الصفحة.<br />يمكنكم العودة إلى الصفحة الرئيسية.</p>
    <a href="/">العودة إلى الرئيسية</a>
  </main>
</body>
</html>
